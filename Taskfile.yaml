---

# Reference:
#   https://taskfile.dev/docs/reference/schema
# JSON schema:
#   https://taskfile.dev/schema.json

# ╭────────────────────----------------──────────╮
# │                     go42x                    │
# ╰─────────────────────----------------─────────╯
#
# Before running any commands, ensure following tools are installed:
# - git @see https://git-scm.com/
# - go @see https://go.dev/
# - docker @see https://www.docker.com/
# - mise @see https://mise.jdx.dev/
# - task @see https://taskfile.dev/
#
# Also, ensure you have logged in to GitHub Container Registry:
#   docker login ghcr.io -u YOUR_GITHUB_USERNAME --password YOUR_GITHUB_TOKEN
# @see https://docs.github.com/en/packages/working-with-a-github-packages-registry/working-with-the-container-registry
#
# This file can be executed manually, from CI, by IDE and invoked by AI.

version: '3'

set:
  - errexit
  - pipefail

env:
  GOTOOLCHAIN: local
  MISE_DEFAULT_CONFIG_FILENAME: etc/mise.toml
  MISE_DATA_DIR: '{{.ROOT_DIR}}/.tools'
  MISE_CACHE_DIR: '{{.ROOT_DIR}}/.tools/cache'
  MISE_STATE_DIR: '{{.ROOT_DIR}}/.tools/state'
  TASK_TEMP_DIR: '{{.ROOT_DIR}}/.tools/task'

tasks:

  # ╭────────────────────----------------──────────╮
  # │                    Setup                     │
  # ╰─────────────────────----------------─────────╯

  help:
    desc: "List available tasks in Taskfile order"
    aliases:
      - default
    cmds:
      - "task --list --sort none"

  x:
    desc: "Run the go42x binary installed by mise"
    summary: "Usage: task x [-- COMMAND ...]"
    interactive: true
    cmds:
      - 'mise exec -- go42x {{.CLI_ARGS}}'

  x:update:
    desc: "Update go42x and merge bundled assets with project customizations (writes)"
    summary: |-
      Usage: task x:update [VERSION=<version>]
      Defaults to the latest available release. Exports the old bundle, updates mise, merges assets, generates agent files, compiles and lints workflows, and refreshes the knowledge base.
    preconditions:
      - sh: 'test -z {{.CLI_ARGS | shellQuote}}'
        msg: "Pass VERSION=... without arguments after --."
    cmds:
      - |
        version={{.VERSION | default "" | shellQuote}}
        if [ -z "$version" ]; then
          # Resolve new releases without the release-age delay or proxy metadata lag.
          version=$(GOPROXY=direct mise latest --minimum-release-age 0s go:github.com/go42-dev/go42x)
        fi
        if [ -z "$version" ]; then
          printf 'mise did not resolve a go42x release.\n' >&2
          exit 1
        fi

        mkdir -p .build
        workspace=$(mktemp -d "$PWD/.build/go42x-update.XXXXXX")
        printf 'Updating go42x to %s; workspace: %s\n' "$version" "$workspace"
        cp -p etc/mise.toml "$workspace/mise.toml"
        cp -p etc/mise.lock "$workspace/mise.lock"
        restore_pins() {
          cp -p "$workspace/mise.toml" etc/mise.toml
          cp -p "$workspace/mise.lock" etc/mise.lock
          printf 'Restored the previous mise pin and lockfile.\n' >&2
        }

        task x -- agentenv export --output "$workspace/base"
        if ! task bump TOOL=go:github.com/go42-dev/go42x "VERSION=$version"; then
          restore_pins
          exit 1
        fi
        if ! task --silent x -- agentenv update --base "$workspace/base" --json > "$workspace/update.json"; then
          cat "$workspace/update.json"
          # Restore only when the command reports that no replacements were applied.
          if grep -Eq '"result":null|"applied":0[,}]' "$workspace/update.json"; then
            restore_pins
          fi
          exit 1
        fi
        cat "$workspace/update.json"
      - task: x
        vars:
          CLI_ARGS: 'agentenv generate'
      - task: x
        vars:
          CLI_ARGS: 'agentenv generate --providers=gh-aw'
      - 'mise exec -- gh-aw compile --no-check-update --strict --purge --approve'
      - task: agentic:lint
      - task: lint:actions
        vars:
          CLI_ARGS: ''
      - task: x
        vars:
          CLI_ARGS: 'kwb build'

  tool:
    desc: "Run a command with the project tools"
    summary: "Usage: task tool -- COMMAND [ARGS...]"
    interactive: true
    silent: true
    preconditions:
      - sh: 'test -n {{.CLI_ARGS | shellQuote}}'
        msg: "Usage: task tool -- COMMAND [ARGS...]"
    cmds:
      - 'mise exec -- {{.CLI_ARGS}}'

  setup:
    desc: "Install pinned project tools and Go modules"
    summary: |-
      Usage: task setup
      Also syncs the pinned Vale styles. Go, mise, and Task must already be installed.
    cmds:
      - "mise install --locked"
      - 'mise exec -- vale --config etc/vale.ini sync'
      - "go mod download"

  setup:generators:
    desc: "Install pinned code generation tools"
    cmds:
      - "mise install --locked go:go.uber.org/mock/mockgen"

  setup:docs:
    desc: "Install pinned documentation tools and Vale styles"
    cmds:
      - "mise install --locked node markdownlint-cli2 vale"
      - 'mise exec -- vale --config etc/vale.ini sync'

  setup:release:
    desc: "Install pinned release tools and Go modules"
    cmds:
      - "mise install --locked goreleaser syft cosign"
      - "go mod download"

  bump:
    desc: "Set a mise tool dependency to a version (writes)"
    summary: |-
      Usage: task bump TOOL=<tool> VERSION=<version>
      Installs the selected tool version and updates etc/mise.toml and etc/mise.lock.
    requires:
      vars:
        - TOOL
        - VERSION
    preconditions:
      - sh: 'test -n {{.TOOL | shellQuote}} && test -n {{.VERSION | shellQuote}}'
        msg: "TOOL and VERSION must not be empty."
      - sh: 'test -z {{.CLI_ARGS | shellQuote}}'
        msg: "Pass TOOL=... VERSION=... without arguments after --."
    cmds:
      - 'mise use --pin -- {{printf "%s@%s" .TOOL .VERSION | shellQuote}}'
      - 'mise lock -- {{.TOOL | shellQuote}}'

  # ╭────────────────────----------------──────────╮
  # │                   Testing                    │
  # ╰─────────────────────----------------─────────╯

  # @note -count=1 is needed to prevent caching of test results.
  test:unit:
    desc: "Run unit tests with race detection and optional coverage"
    aliases:
      - test
    summary: |-
      Usage: task test:unit [-- PACKAGE ...]
      Defaults to the full unit suite with coverage. Explicit local packages skip coverage reports; Go test flags are not accepted.
    preconditions:
      - &package_paths
        sh: |
          set -- {{.CLI_ARGS}}
          for package do
            case "$package" in
              ./*) [ ! -d "${package%/...}" ] || continue ;;
            esac
            printf 'Expected a local Go package or subtree: %s\n' "$package" >&2
            exit 2
          done
        msg: "Pass local Go packages after --."
    cmds:
      - |
        set -eo pipefail
        set -- {{.CLI_ARGS}}
        if [ "$#" -gt 0 ]; then
          exec go test -count=1 -race -skip '^Fuzz' "$@"
        fi

        mkdir -p .build

        unit_packages=$(go list ./...)
        unit_exclude_pattern=$(printf '%s\n' mocks tests | paste -sd '|' -)
        unit_packages=$(printf '%s\n' "$unit_packages" | grep -vE "/($unit_exclude_pattern)(/|$)")

        # go list returns separate package names; preserve word splitting here.
        # shellcheck disable=SC2086
        go test -count=1 -v -race -skip '^Fuzz' -covermode=atomic \
          -coverpkg="$(printf '%s\n' "$unit_packages" | paste -sd, -)" \
          -coverprofile=.build/coverage.out $unit_packages \
          | sed -E 's/(coverage: [0-9.]+% of statements) in .*/\1/'

        go tool cover -html=.build/coverage.out -o=.build/coverage.html
        go tool cover -func=.build/coverage.out | grep '^total:'

  test:integration:
    desc: "Run integration tests with race detection and coverage"
    cmds:
      - |
        set -eo pipefail
        mkdir -p .build

        coverage_packages=$(go list -deps -test -f '{{`{{if .Module}}{{if .Module.Main}}{{.ImportPath}}{{end}}{{end}}`}}' ./tests/integration/...)
        coverage_exclude_pattern=$(printf '%s\n' mocks tests | paste -sd '|' -)
        coverage_packages=$(printf '%s\n' "$coverage_packages" | grep -vE "/($coverage_exclude_pattern)(/|$)" | paste -sd, -)

        go test -count=1 -v -race -timeout=5m -covermode=atomic -coverpkg="$coverage_packages" \
          -coverprofile=.build/coverage-integration.out ./tests/integration/... \
          | sed -E 's/(coverage: [0-9.]+% of statements) in .*/\1/'

        go tool cover -html=.build/coverage-integration.out -o=.build/coverage-integration.html
        go tool cover -func=.build/coverage-integration.out | grep '^total:'

  test:e2e:
    desc: "Test the compiled CLI in isolated temporary projects"
    summary: |-
      Usage: task test:e2e
      Builds the CLI once with race detection and coverage. Set environment variables GO42X_E2E_BINARY to an absolute executable path and GO42X_E2E_VERSION to test an existing binary without coverage. Use task test:release for release archives.
    cmds:
      - |
        set -eo pipefail
        if [ -n "${GO42X_E2E_BINARY:-}" ] || [ -n "${GO42X_E2E_VERSION:-}" ] || [ -n "${GO42X_RELEASE_DIST:-}" ]; then
          exec go test -count=1 -v -race -timeout=5m ./tests/e2e/...
        fi

        rm -rf .build/coverage-e2e{.out,.out.tmp,.html,-tests,-app}
        mkdir -p .build/coverage-e2e-{tests,app}

        coverage_packages=$(go list -deps -test -f '{{`{{if .Module}}{{if .Module.Main}}{{.ImportPath}}{{end}}{{end}}`}}' ./tests/e2e/...)
        coverage_exclude_pattern=$(printf '%s\n' mocks tests | paste -sd '|' -)
        coverage_packages=$(printf '%s\n' "$coverage_packages" | grep -vE "/($coverage_exclude_pattern)(/|$)" | paste -sd, -)

        export GO42X_E2E_COVERDIR="${PWD}/.build/coverage-e2e-app"
        go test -count=1 -v -race -timeout=5m -cover -covermode=atomic -coverpkg="$coverage_packages" ./tests/e2e/... \
          -args -test.gocoverdir="${PWD}/.build/coverage-e2e-tests" \
          | sed -E 's/(coverage: [0-9.]+% of statements) in .*/\1/'

        ls .build/coverage-e2e-{tests,app}/cov{meta,counters}.* > /dev/null
        go tool covdata textfmt \
          -i=.build/coverage-e2e-tests,.build/coverage-e2e-app \
          -o=.build/coverage-e2e.out.tmp
        mv .build/coverage-e2e.out.tmp .build/coverage-e2e.out

        go tool cover -html=.build/coverage-e2e.out -o=.build/coverage-e2e.html
        go tool cover -func=.build/coverage-e2e.out | grep '^total:'

  test:release:
    desc: "Verify release artifacts and test the native archive"
    summary: |-
      Usage: task test:release [GO42X_RELEASE_DIST=.build/dist]
      Create artifacts first with task release:snapshot. Relative paths resolve from the repository root. Do not combine GO42X_RELEASE_DIST with GO42X_E2E_BINARY or GO42X_E2E_VERSION.
    env:
      GO42X_RELEASE_DIST: '{{.GO42X_RELEASE_DIST | default ".build/dist"}}'
    cmds:
      - "go test -count=1 -v -race -timeout=5m ./tests/e2e/..."

  # ╭────────────────────----------------──────────╮
  # │               General workflow               │
  # ╰─────────────────────----------------─────────╯

  # `-N -l` disables compiler optimizations and inlining, which makes debugging easier.
  run:
    desc: "Run the application from source"
    summary: "Usage: task run [-- APP_ARGS...]"
    interactive: true
    cmds:
      - >-
        go run -gcflags="all=-N -l" -race
        . {{.CLI_ARGS}}

  # `-N -l` disables compiler optimizations and inlining, which makes debugging easier.
  # Use the Go version from go.mod and keep compilation caches between runs.
  run:docker:
    desc: "Run the application from source in a Linux Go container"
    summary: "Usage: task run:docker [-- APP_ARGS...]"
    interactive: true
    vars:
      GO_VERSION:
        sh: "awk '/^go / {print $2}' go.mod"
    cmds:
      - >-
        docker run --rm -it --init
        -v go-cache:/root/.cache/go-build
        -v go-mod-cache:/go/pkg/mod
        -v "$PWD:/app"
        -w /app
        {{printf "golang:%s" .GO_VERSION | shellQuote}}
        go run -gcflags="all=-N -l" -race
        . {{.CLI_ARGS}}

  debug:
    desc: "Run the application with the Delve debugger"
    summary: |-
      Usage: task debug [-- APP_ARGS...]
      Connect your debugger to localhost:2345.
    interactive: true
    cmds:
      - "mkdir -p .build"
      - >-
        mise exec -- dlv debug .
        --headless --listen=127.0.0.1:2345 --accept-multiclient --api-version=2
        --output=.build/go42x-debug -- {{.CLI_ARGS}}

  build:
    desc: "Build a development binary in .build"
    summary: |-
      Usage: task build [-- BUILD_FLAGS...]
      Builds with race detection and compiler optimizations disabled.
    cmds:
      - "mkdir -p .build"
      - >-
        go build -gcflags="all=-N -l" -race -v
        {{.CLI_ARGS}} -o .build/go42x .
      - >-
        file -h .build/go42x && du -h .build/go42x && sha256sum .build/go42x && go tool buildid .build/go42x

  image:
    desc: "Build and load the local MCP tools image"
    summary: |-
      Usage: task image [IMAGE=ghcr.io/go42-dev/go42x:dev] [VERSION=dev] [-- BUILD_FLAGS...]
      Defaults to the host platform; extra arguments are Docker Buildx flags.
    vars:
      IMAGE: '{{default "ghcr.io/go42-dev/go42x:dev" .IMAGE}}'
      VERSION: '{{default "dev" .VERSION}}'
      GO_VERSION:
        sh: "awk '/^go / {print $2}' go.mod"
      GOPLS_VERSION:
        sh: >-
          sed -n 's/^"go:golang.org\/x\/tools\/gopls" = "\(.*\)"$/\1/p' etc/mise.toml
      MISE_VERSION:
        sh: >-
          sed -n 's/^min_version = "\(.*\)"$/\1/p' etc/mise.toml
      COMMIT:
        sh: "git rev-parse HEAD"
    cmds:
      - >-
        docker buildx build --load
        --build-arg {{printf "GO_VERSION=%s" .GO_VERSION | shellQuote}}
        --build-arg {{printf "GOPLS_VERSION=%s" .GOPLS_VERSION | shellQuote}}
        --build-arg {{printf "MISE_VERSION=%s" .MISE_VERSION | shellQuote}}
        --build-arg {{printf "COMMIT_HASH=%s" .COMMIT | shellQuote}}
        --build-arg {{printf "RELEASE_TAG=%s" .VERSION | shellQuote}}
        --build-arg SOURCE_DATE_EPOCH=0
        --tag {{.IMAGE | shellQuote}}
        {{.CLI_ARGS}} .

  generate:
    desc: "Regenerate code and tidy Go dependencies"
    summary: |-
      Usage: task generate
      Run task setup:generators first; updates generated files and Go module metadata.
    cmds:
      - "go mod tidy"
      - 'mise exec -- go generate ./...'

  # ╭────────────────────----------------──────────╮
  # │                  Formatters                  │
  # ╰─────────────────────----------------─────────╯

  fmt:go:
    desc: "Format explicit Go source files (writes)"
    summary: "Usage: task fmt:go -- FILE.go [FILE.go ...]"
    preconditions: &files
      - sh: |
          set -- {{.CLI_ARGS}}
          [ "$#" -gt 0 ]
        msg: "Pass explicit file paths after --."
      - &file_paths
        sh: |
          set -- {{.CLI_ARGS}}
          for file do
            case "$file" in
              -*|!*|*\**|*\?*|*\[*|*\]*|*\{*|*\}*) printf 'Expected a literal file path: %s\n' "$file" >&2; exit 2 ;;
            esac
            [ -f "$file" ] || { printf 'Expected an existing file: %s\n' "$file" >&2; exit 2; }
          done
        msg: "Pass explicit existing file paths after --."
    cmds:
      - |
        set -- {{.CLI_ARGS}}
        mise exec -- golangci-lint fmt --config etc/golangci.yml "$@"

  fmt:yaml:
    desc: "Format explicit plain YAML files (writes)"
    summary: >-
      Usage: task fmt:yaml -- FILE.yaml [FILE.yaml ...]
    preconditions: *files
    cmds:
      - |
        set -- {{.CLI_ARGS}}
        mise exec -- yamlfmt -conf etc/yamlfmt.yaml "$@"

  fmt:json:
    desc: "Format explicit JSON files (writes)"
    summary: "Usage: task fmt:json -- FILE.json [FILE.json ...]"
    preconditions: *files
    cmds:
      - |
        set -- {{.CLI_ARGS}}
        mise exec -- jsonfmt -w "$@"

  fmt:toml:
    desc: "Format explicit TOML files (writes)"
    summary: "Usage: task fmt:toml -- FILE.toml [FILE.toml ...]"
    preconditions: *files
    cmds:
      - |
        set -- {{.CLI_ARGS}}
        for file do
          case "$file" in
            /*) ;;
            *) file="$PWD/$file" ;;
          esac
          # Tombi discovers etc/tombi.toml from its working directory.
          (cd etc && mise exec -- tombi format --offline "$file")
        done

  # ╭────────────────────----------------──────────╮
  # │                   Linters                    │
  # ╰─────────────────────----------------─────────╯

  lint:
    desc: "Run code, configuration, and documentation linters"
    summary: |-
      Usage: task lint
      Accepts no arguments; use a lint:* task to select files or packages.
    preconditions:
      - sh: |
          set -- {{.CLI_ARGS}}
          [ "$#" -eq 0 ]
        msg: "Use a lint:* task for file or package arguments."
    cmds:
      - task: "lint:go"
      - task: "lint:nilaway"
      - task: "lint:go-security"
      - task: "lint:vulnerabilities"
      - task: "lint:secrets"
      - task: "lint:json"
      - task: "lint:yaml"
      - task: "lint:toml"
      - task: "lint:docker"
      - task: "lint:actions"
      - task: "lint:editorconfig"
      - task: "agentic:lint"
      - task: "docs:check"

  lint:go:
    desc: "Lint all Go packages, or explicit local packages and subtrees (read only)"
    summary: "Usage: task lint:go [-- ./internal/cmd ./internal/kwb/...]"
    preconditions:
      - *package_paths
    cmds:
      - |
        set -- {{.CLI_ARGS}}
        mise exec -- golangci-lint config verify --config etc/golangci.yml
        mise exec -- golangci-lint run --config etc/golangci.yml "$@"

  lint:nilaway:
    desc: "Run advisory nil-safety analysis on all Go packages"
    cmds:
      - |
        go vet -vettool="$(mise which nilaway)" \
          -include-pkgs=github.com/go42-dev/go42x \
          -exclude-file-docstrings='Code generated' \
          -include-errors-in-files="$(pwd -P)" \
          -pretty-print=false \
          -print-full-file-path=true \
          ./... || true

  lint:go-security:
    desc: "Check Go code with gosec"
    vars:
      PACKAGE_DIRS:
        sh: go list -f '{{"{{"}}.Dir{{"}}"}}' ./...
    cmds:
      - |
        set -- {{range splitList "\n" .PACKAGE_DIRS}}{{if .}}{{. | shellQuote}} {{end}}{{end}}
        mise exec -- gosec -terse -exclude-generated "$@"

  lint:vulnerabilities:
    desc: "Check CLI vulnerabilities for all release platforms"
    cmds:
      - 'CGO_ENABLED=0 GOOS=linux GOARCH=amd64 mise exec -- govulncheck .'
      - 'CGO_ENABLED=0 GOOS=linux GOARCH=arm64 mise exec -- govulncheck .'
      - 'CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 mise exec -- govulncheck .'
      - 'CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 mise exec -- govulncheck .'

  lint:secrets:
    desc: "Scan Git history for secrets with Gitleaks"
    cmds:
      - 'mise exec -- gitleaks git --config etc/gitleaks.toml --no-banner --redact -v'

  lint:docker:
    desc: "Check Dockerfile instructions with Hadolint"
    cmds:
      - 'mise exec -- hadolint --failure-threshold info Dockerfile'

  lint:actions:
    desc: "Check all GitHub Actions, or explicit workflow files (read only)"
    summary: |-
      Usage: task lint:actions [-- .github/workflows/FILE.yaml ...]
      Defaults include composite actions in Zizmor.
    preconditions:
      - *file_paths
    cmds:
      - |
        set -- {{.CLI_ARGS}}
        mise exec -- actionlint -oneline --config-file etc/actionlint.yaml "$@"
        if [ "$#" -eq 0 ]; then set -- .; fi
        mise exec -- zizmor -q --persona regular --min-severity high --min-confidence high \
          --offline --format plain --color never --no-progress "$@"

  lint:editorconfig:
    desc: "Check EditorConfig rules for the project, or explicit files (read only)"
    summary: "Usage: task lint:editorconfig [-- FILE ...]"
    preconditions:
      - *file_paths
    cmds:
      - |
        set -- {{.CLI_ARGS}}
        mise exec -- ec -config etc/editorconfig.json "$@"

  lint:yaml:
    desc: "Check plain YAML source formatting, or explicit files (read only)"
    summary: |-
      Usage: task lint:yaml [-- FILE.yaml ...]
      Defaults to Git source YAML files, excluding compiled workflow locks.
    vars:
      SOURCE_FILES:
        sh: |
          {{if not .CLI_ARGS}}
          git ls-files --cached --others --exclude-standard -z -- '*.yaml' '*.yml' ':!:.github/workflows/*.lock.yml'
          {{end}}
    preconditions:
      - *file_paths
    cmds:
      - |
        set -- {{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}{{range splitList "\x00" .SOURCE_FILES}}{{if .}}{{. | shellQuote}} {{end}}{{end}}{{end}}
        for file do
          if [ -f "$file" ]; then
            mise exec -- yamlfmt -conf etc/yamlfmt.yaml -lint "$file"
          fi
        done

  lint:json:
    desc: "Check JSON source formatting, or explicit files (read only)"
    summary: |-
      Usage: task lint:json [-- FILE.json ...]
      Defaults exclude package-lock.json.
    vars:
      SOURCE_FILES:
        sh: |
          {{if not .CLI_ARGS}}
          git ls-files --cached --others --exclude-standard -z -- '*.json' ':!:**/package-lock.json'
          {{end}}
    preconditions:
      - *file_paths
    cmds:
      - |
        set -- {{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}{{range splitList "\x00" .SOURCE_FILES}}{{if .}}{{. | shellQuote}} {{end}}{{end}}{{end}}
        for file do
          if [ -f "$file" ]; then
            mise exec -- jsonfmt "$file"
          fi
        done

  lint:toml:
    desc: "Check TOML source formatting and lint rules, or explicit files (read only)"
    summary: |-
      Usage: task lint:toml [-- FILE.toml ...]
      Defaults to Git source files ending in .toml.
    vars:
      SOURCE_FILES:
        sh: |
          {{if not .CLI_ARGS}}
          git ls-files --cached --others --exclude-standard -z -- '*.toml'
          {{end}}
    preconditions:
      - *file_paths
    cmds:
      - |
        set -- {{if .CLI_ARGS}}{{.CLI_ARGS}}{{else}}{{range splitList "\x00" .SOURCE_FILES}}{{if .}}{{. | shellQuote}} {{end}}{{end}}{{end}}
        for file do
          if [ -f "$file" ]; then
            case "$file" in
              /*) ;;
              *) file="$PWD/$file" ;;
            esac
            # Tombi discovers etc/tombi.toml from its working directory.
            (
              cd etc
              mise exec -- tombi format --offline --check "$file"
              mise exec -- tombi lint --offline --error-on-warnings "$file"
            )
          fi
        done

  lint:markdown:
    desc: "Lint documentation Markdown, or explicit files (read only)"
    summary: |-
      Usage: task lint:markdown [-- FILE.md ...]
      Defaults to docs/**/*.md.
    preconditions:
      - *file_paths
    cmds:
      - |
        set -- {{.CLI_ARGS}}
        if [ "$#" -eq 0 ]; then
          mise exec -- markdownlint-cli2 --config etc/markdownlint-cli2.yaml
        else
          mise exec -- markdownlint-cli2 --config etc/markdownlint-cli2.yaml --no-globs "$@"
        fi

  lint:prose:
    desc: "Check documentation prose, or explicit files (read only)"
    summary: |-
      Usage: task lint:prose [-- FILE.md ...]
      Defaults to docs/.
    preconditions:
      - *file_paths
    cmds:
      - |
        set -- {{.CLI_ARGS}}
        if [ "$#" -eq 0 ]; then set -- docs/; fi
        mise exec -- vale --config etc/vale.ini "$@"

  # ╭────────────────────----------------──────────╮
  # │                Documentation                 │
  # ╰─────────────────────----------------─────────╯

  docs:check:
    desc: "Lint documentation Markdown and prose"
    summary: |-
      Usage: task docs:check
      Run task setup:docs first; checks Markdown formatting and prose under docs/.
    cmds:
      - task: "lint:markdown"
        vars:
          CLI_ARGS: ""
      - task: "lint:prose"
        vars:
          CLI_ARGS: ""

  # ╭────────────────────----------------──────────╮
  # │                   Release                    │
  # ╰─────────────────────----------------─────────╯

  release:check:
    desc: "Validate GoReleaser configuration"
    cmds:
      - 'mise exec -- goreleaser check --config etc/goreleaser.yaml'

  release:snapshot:
    desc: "Build release artifacts without publishing or signing"
    summary: |-
      Usage: task release:snapshot
      Run task setup:release first; writes unsigned snapshot artifacts to .build/dist.
    cmds:
      - 'mise exec -- goreleaser release --config etc/goreleaser.yaml --snapshot --clean --skip=publish,sign'

  release:local:
    desc: "Build and sign a tagged release without publishing"
    summary: |-
      Usage: task release:local
      Run task setup:release first; requires a release tag and Cosign authentication. Writes signed artifacts to .build/dist.
    cmds:
      - 'mise exec -- goreleaser release --config etc/goreleaser.yaml --clean --skip=publish'

  release:
    desc: "Build, sign, and publish a release (CI only)"
    summary: |-
      Usage: task release
      Invoked by the release workflow with a validated tag and release credentials; requires GITHUB_ACTIONS=true.
    preconditions:
      - sh: '[ "$GITHUB_ACTIONS" = "true" ]'
        msg: "Dispatch the release workflow from master to publish a release."
    cmds:
      - 'mise exec -- goreleaser release --config etc/goreleaser.yaml --clean'

  # ╭────────────────────----------------──────────╮
  # │              Agentic workflows               │
  # ╰─────────────────────----------------─────────╯

  agentic:lint:
    desc: "Lint compiled GitHub Agentic Workflows"
    summary: |-
      Usage: task agentic:lint [-- FILE.lock.yml ...]
      Defaults to all workflow locks.
    preconditions:
      - *file_paths
    cmds:
      - 'mise exec -- gh-aw lint {{.CLI_ARGS}}'

  agentic:generate:
    desc: "Generate agent instructions and gh-aw MCP declarations"
    summary: |-
      Usage: task agentic:generate
      Uses the mise-pinned go42x binary to generate shared agent instructions and the gh-aw MCP fragment from project configuration.
    cmds:
      - task: x
        vars:
          CLI_ARGS: 'agentenv generate --providers=gh-aw'

  agentic:compile:
    desc: "Generate agent instructions and compile agentic workflows"
    summary: |-
      Usage: task agentic:compile
      Runs task agentic:generate, then compiles all workflows in strict mode, approves safe updates, and removes stale workflow locks.
    cmds:
      - task: agentic:generate
      - 'mise exec -- gh-aw compile --no-check-update --strict --purge --approve'
