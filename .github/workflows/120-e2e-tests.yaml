---

name: e2e-tests

# Runs the compiled CLI against isolated projects without external services.

on:
  workflow_call:
    inputs:
      runs_on:
        required: true
        type: string
      continue_on_error:
        required: true
        type: boolean
      source_sha:
        description: "Commit to test; defaults to the triggering ref"
        required: false
        type: string
        default: ''
      timeout_minutes:
        required: false
        type: number
        default: 10

permissions: {}

jobs:
  e2e-tests:
    name: e2e-tests
    runs-on: ${{ inputs.runs_on }}
    continue-on-error: ${{ inputs.continue_on_error }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: 'Setup Go'
        id: setup-go
        uses: ./.github/actions/setup-go
        with:
          cache-scope: e2e-tests
      - name: 'Install mise and Task'
        uses: ./.github/actions/setup-tools
      - name: 'Run end-to-end tests with coverage and race detector'
        run: task test:e2e
        env:
          CGO_ENABLED: 1 # needed for the test runner and CLI -race builds
      - name: 'Upload coverage reports'
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-coverage
          path: |-
            .build/coverage-e2e.out
            .build/coverage-e2e.html
          include-hidden-files: true
          if-no-files-found: error
