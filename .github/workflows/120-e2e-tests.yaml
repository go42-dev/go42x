---

name: e2e-tests

# Runs the compiled CLI against isolated projects without external services.

on:
  workflow_call:
    inputs:
      runs_on:
        required: true
        type: string
      continue_on_error:
        required: true
        type: boolean
      source_sha:
        description: "Commit to test; defaults to the triggering ref"
        required: false
        type: string
        default: ''
      timeout_minutes:
        required: false
        type: number
        default: 10

permissions: {}

jobs:
  e2e-tests:
    name: e2e-tests
    runs-on: ${{ inputs.runs_on }}
    continue-on-error: ${{ inputs.continue_on_error }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    env:
      MISE_DEFAULT_CONFIG_FILENAME: etc/mise.toml
      MISE_DATA_DIR: ${{ github.workspace }}/.tools
      MISE_CACHE_DIR: ${{ github.workspace }}/.tools/cache
      MISE_STATE_DIR: ${{ github.workspace }}/.tools/state
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: 'Setup Go'
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: false
      - name: 'Get Go cache paths'
        id: go-cache
        shell: bash
        run: |
          {
            echo "go-build=$(go env GOCACHE)"
            echo "go-mod=$(go env GOMODCACHE)"
          } >> "$GITHUB_OUTPUT"
      - name: 'Restore and save Go caches'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        env:
          GO_CACHE_PREFIX: go-tests-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-${{ github.job
            }}
        with:
          path: |
            ${{ steps.go-cache.outputs.go-build }}
            ${{ steps.go-cache.outputs.go-mod }}
          key: ${{ env.GO_CACHE_PREFIX }}-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |
            ${{ env.GO_CACHE_PREFIX }}-${{ hashFiles('go.mod', 'go.sum') }}-
            ${{ env.GO_CACHE_PREFIX }}-
      - name: 'Install pinned Task'
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: '2026.9.1'
          install_args: --locked task
      - name: 'Download Go modules'
        run: go mod download
      - name: 'Run end-to-end tests with race detector'
        run: task test:e2e
        env:
          CGO_ENABLED: 1 # needed for the test runner and CLI -race builds
