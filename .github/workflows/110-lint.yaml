---

name: lint

# Lint source code, project files, and GitHub Actions.

on:
  workflow_call:
    inputs:
      runs_on:
        required: true
        type: string
      continue_on_error:
        required: true
        type: boolean
      timeout_minutes:
        required: false
        type: number
        default: 10

permissions: {}

jobs:

  # Golang linter.
  # @see https://golangci-lint.run/
  golangci-lint:
    name: golangci-lint
    runs-on: ${{ inputs.runs_on }}
    continue-on-error: ${{ inputs.continue_on_error }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    env:
      GOLANGCI_LINT_CACHE: ${{ github.workspace }}/.build/golangci-lint-cache
    # ----
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 'Setup Go'
        id: setup-go
        uses: ./.github/actions/setup-go
        with:
          cache-scope: golangci-lint
      - name: 'Install pinned golangci-lint'
        uses: ./.github/actions/setup-tools
        with:
          install-args: --locked golangci-lint
      - name: 'Get lint cache metadata'
        id: lint-cache
        shell: bash
        run: |-
          {
            echo "lint-version=$(golangci-lint version --short)"
          } >> "$GITHUB_OUTPUT"
      - name: 'Restore and save golangci-lint results'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          LINT_CACHE_PREFIX: golangci-lint-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-${{
            steps.lint-cache.outputs.lint-version }}
        with:
          path: |-
            ${{ env.GOLANGCI_LINT_CACHE }}
          # Refresh per commit; reuse compatible entries after dependency/config changes.
          key: ${{ env.LINT_CACHE_PREFIX }}-${{ hashFiles('etc/golangci.yml', 'go.mod', 'go.sum') }}-${{ github.sha }}
          restore-keys: |-
            ${{ env.LINT_CACHE_PREFIX }}-${{ hashFiles('etc/golangci.yml', 'go.mod', 'go.sum') }}-
            ${{ env.LINT_CACHE_PREFIX }}-
      - name: 'Validate golangci-lint configuration'
        run: golangci-lint config verify --config etc/golangci.yml
      - name: 'Run golangci-lint'
        run: golangci-lint run --config etc/golangci.yml --verbose

  # Detect potential nil panics with NilAway through Go's cached vet driver.
  # @see https://github.com/uber-go/nilaway
  nilaway-lint:
    name: nilaway-lint
    runs-on: ${{ inputs.runs_on }}
    # NilAway findings remain advisory.
    continue-on-error: true
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 'Setup Go'
        id: setup-go
        uses: ./.github/actions/setup-go
        with:
          cache-scope: nilaway
      - name: 'Install pinned NilAway'
        uses: ./.github/actions/setup-tools
        with:
          install-args: --locked nilaway
      - name: 'Run NilAway'
        shell: bash
        run: |-
          go vet -vettool="$(mise which nilaway)" \
            -include-pkgs=github.com/go42-dev/go42x \
            -exclude-file-docstrings='Code generated' \
            -include-errors-in-files="$(pwd -P)" \
            -pretty-print=false \
            -print-full-file-path=true \
            ./...

  # Linter for Dockerfile.
  # @see https://github.com/hadolint/hadolint
  docker-lint:
    name: docker-lint
    runs-on: ${{ inputs.runs_on }}
    continue-on-error: ${{ inputs.continue_on_error }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    # ----
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ----
      - name: Install pinned Hadolint
        uses: ./.github/actions/setup-tools
        with:
          install-args: --locked hadolint
      - name: Run Hadolint
        shell: bash
        env:
          NO_COLOR: 'true'
        run: |-
          # Keep GitHub annotations for the native Hadolint output.
          cat > "$RUNNER_TEMP/hadolint-matcher.json" <<'JSON'
          {
            "problemMatcher": [{
              "owner": "hadolint",
              "pattern": [{
                "regexp": "^(.+):(\\d+)\\s(.+)\\s(error|warning|info|style):\\s(.+)$",
                "file": 1,
                "line": 2,
                "code": 3,
                "severity": 4,
                "message": 5
              }]
            }]
          }
          JSON
          echo "::add-matcher::$RUNNER_TEMP/hadolint-matcher.json"
          trap 'echo "::remove-matcher owner=hadolint::"' EXIT
          hadolint --failure-threshold info Dockerfile

  # JSON, YAML, and TOML formatting and lint rules.
  # @see https://github.com/caarlos0/jsonfmt
  # @see https://github.com/google/yamlfmt
  # @see https://github.com/pelletier/go-toml
  config-lint:
    name: config-lint
    runs-on: ${{ inputs.runs_on }}
    continue-on-error: ${{ inputs.continue_on_error }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 'Setup Go'
        uses: ./.github/actions/setup-go
        with:
          cache: false
      - name: 'Install pinned configuration linters'
        uses: ./.github/actions/setup-tools
        with:
          install-args: --locked jsonfmt yamlfmt tombi
      - name: 'Check JSON formatting'
        run: task --exit-code lint:json
      - name: 'Check YAML formatting'
        run: task --exit-code lint:yaml
      - name: 'Check TOML formatting and lint rules'
        run: task --exit-code lint:toml

  # Authored and generated GitHub Actions workflows.
  # @see https://github.com/rhysd/actionlint
  action-lint:
    name: action-lint
    runs-on: ${{ inputs.runs_on }}
    continue-on-error: ${{ inputs.continue_on_error }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 'Install pinned Actionlint'
        uses: ./.github/actions/setup-tools
        with:
          install-args: --locked actionlint
      - name: 'Check all GitHub Actions workflows'
        run: actionlint -oneline --config-file etc/actionlint.yaml

  # Action security audit.
  # @see https://github.com/zizmor-labs/zizmor
  zizmor-lint:
    name: zizmor-lint
    runs-on: ${{ inputs.runs_on }}
    continue-on-error: ${{ inputs.continue_on_error }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    # ----
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 'Install pinned Zizmor'
        uses: ./.github/actions/setup-tools
        with:
          install-args: --locked zizmor
      - name: 'Run zizmor security audit'
        shell: bash
        run: zizmor -q --persona regular --min-severity high --min-confidence high --offline --format plain --color never
          --no-progress .

  # Agentic workflow sources and compiler-owned lock files.
  # @see https://github.github.com/gh-aw/
  agentic-lint:
    name: agentic-lint
    runs-on: ${{ inputs.runs_on }}
    continue-on-error: ${{ inputs.continue_on_error }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 'Setup Go'
        uses: ./.github/actions/setup-go
        with:
          cache: true
          # Build the source CLI used during agent preparation.
          cache-scope: agent
      - name: 'Install pinned agentic workflow tools'
        uses: ./.github/actions/setup-tools
        with:
          setup-task: setup:generators
      - name: 'Generate and compile agentic workflows'
        env:
          GH_TOKEN: ${{ github.token }}
        run: task --exit-code generate:agentic
      - name: 'Scan generated agent instructions for secrets'
        run: task --exit-code lint:secrets -- AGENTS.md
      - name: 'Check for uncommitted changes'
        shell: bash
        run: |-
          if [[ -n $(git status --porcelain) ]]; then
            echo "Uncommitted changes detected after running 'task generate:agentic'"
            echo "The following files have changes:"
            git status --porcelain
            echo ""
            echo "Please run 'task setup && task generate:agentic' locally and commit the changes."
            exit 1
          else
            echo "No uncommitted changes detected"
          fi
      - name: 'Check compiled GitHub Agentic Workflows'
        run: task --exit-code lint:agentic

  # EditorConfig linter.
  # @see https://editorconfig-checker.github.io/
  editorconfig-lint:
    name: editorconfig-lint
    runs-on: ${{ inputs.runs_on }}
    continue-on-error: ${{ inputs.continue_on_error }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    # ----
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 'Install pinned EditorConfig Checker'
        uses: ./.github/actions/setup-tools
        with:
          install-args: --locked editorconfig-checker
      - name: 'Run editorconfig-checker'
        shell: bash
        run: task lint:editorconfig

  # Documentation checks use the same Task entrypoint locally and in CI.
  docs-lint:
    name: docs-lint
    runs-on: ${{ inputs.runs_on }}
    continue-on-error: ${{ inputs.continue_on_error }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 'Install mise and Task'
        uses: ./.github/actions/setup-tools
        with:
          setup-task: setup:docs
      - name: 'Check documentation'
        run: task docs:check

  # Ensure generated files and Go module metadata are committed and up to date.
  project-lint:
    name: project-lint
    runs-on: ${{ inputs.runs_on }}
    continue-on-error: ${{ inputs.continue_on_error }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 'Prepare code generation environment'
        uses: ./.github/actions/prepare-env
        with:
          setup-task: setup:generators
          go-cache-scope: generators
      - name: 'Generate code'
        run: task generate:code
      - name: 'Check for uncommitted changes'
        shell: bash
        run: |-
          if [[ -n $(git status --porcelain) ]]; then
            echo "Uncommitted changes detected after running 'task generate:code'"
            echo "The following files have changes:"
            git status --porcelain
            echo ""
            echo "Please run 'task setup && task generate:code' locally and commit the changes."
            exit 1
          else
            echo "No uncommitted changes detected"
          fi
