---

name: security

# Vulnerability / data leak detection.
# @see https://github.com/gitleaks/gitleaks
# @see https://github.com/securego/gosec
# @see https://pkg.go.dev/golang.org/x/vuln/cmd/govulncheck

on:
  workflow_call:
    inputs:
      runs_on:
        required: true
        type: string
      continue_on_error:
        required: true
        type: boolean
      timeout_minutes:
        required: false
        type: number
        default: 15

permissions: {}

jobs:

  gitleaks:
    name: gitleaks
    runs-on: ${{ inputs.runs_on }}
    continue-on-error: ${{ inputs.continue_on_error }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    env:
      MISE_DEFAULT_CONFIG_FILENAME: etc/mise.toml
      MISE_DATA_DIR: ${{ github.workspace }}/.tools
      MISE_CACHE_DIR: ${{ github.workspace }}/.tools/cache
      MISE_STATE_DIR: ${{ github.workspace }}/.tools/state
    # -----
    steps:
      - name: 'Checkout repository with full history'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 'Install pinned Gitleaks'
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: '2026.9.1'
          install_args: --locked gitleaks
      - name: 'Run Gitleaks scan'
        shell: bash
        run: gitleaks git --config etc/gitleaks.toml --no-banner --redact -v

  gosec:
    name: gosec
    runs-on: ${{ inputs.runs_on }}
    continue-on-error: ${{ inputs.continue_on_error }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    env:
      MISE_DEFAULT_CONFIG_FILENAME: etc/mise.toml
      MISE_DATA_DIR: ${{ github.workspace }}/.tools
      MISE_CACHE_DIR: ${{ github.workspace }}/.tools/cache
      MISE_STATE_DIR: ${{ github.workspace }}/.tools/state
    # -----
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 'Setup Go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
      - name: 'Install pinned Gosec'
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: '2026.9.1'
          install_args: --locked go:github.com/securego/gosec/v2/cmd/gosec
          # Rebuild the cached binary when the project's Go version changes.
          cache_key_prefix: mise-gosec-v1-${{ hashFiles('go.mod') }}
      - name: 'Run Gosec security scanner'
        shell: bash
        run: gosec -terse -exclude-generated -exclude-dir=.build -exclude-dir=.tools ./...

  govulncheck:
    name: govulncheck
    runs-on: ${{ inputs.runs_on }}
    continue-on-error: ${{ inputs.continue_on_error }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    env:
      MISE_DEFAULT_CONFIG_FILENAME: etc/mise.toml
      MISE_DATA_DIR: ${{ github.workspace }}/.tools
      MISE_CACHE_DIR: ${{ github.workspace }}/.tools/cache
      MISE_STATE_DIR: ${{ github.workspace }}/.tools/state
    # -----
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 'Setup Go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
      - name: 'Install pinned govulncheck'
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: '2026.9.1'
          install_args: --locked go:golang.org/x/vuln/cmd/govulncheck
          # Rebuild the cached binary when the project's Go version changes.
          cache_key_prefix: mise-govulncheck-v1-${{ hashFiles('go.mod') }}
      # Match the CLI entry point and all GoReleaser build platforms.
      - name: 'Run Go vulnerability check (linux/amd64)'
        shell: bash
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 govulncheck .
      - name: 'Run Go vulnerability check (linux/arm64)'
        shell: bash
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 govulncheck .
      - name: 'Run Go vulnerability check (darwin/amd64)'
        shell: bash
        run: CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 govulncheck .
      - name: 'Run Go vulnerability check (darwin/arm64)'
        shell: bash
        run: CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 govulncheck .
