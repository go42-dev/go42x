---

name: security

# Vulnerability / data leak detection.
# @see https://github.com/gitleaks/gitleaks
# @see https://github.com/securego/gosec
# @see https://pkg.go.dev/golang.org/x/vuln/cmd/govulncheck
# @see https://codeql.github.com/

on:
  workflow_call:
    inputs:
      runs_on:
        required: true
        type: string
      continue_on_error:
        required: true
        type: boolean
      timeout_minutes:
        required: false
        type: number
        default: 15
      codeql_timeout_minutes:
        required: false
        type: number
        default: 30

permissions: {}

jobs:

  gitleaks:
    name: gitleaks
    runs-on: ${{ inputs.runs_on }}
    continue-on-error: ${{ inputs.continue_on_error }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    # -----
    steps:
      - name: 'Checkout repository with full history'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 'Install pinned Gitleaks'
        uses: ./.github/actions/setup-tools
        with:
          install-args: --locked gitleaks
      - name: 'Run Gitleaks scan'
        shell: bash
        run: gitleaks git --config etc/gitleaks.toml --no-banner --redact -v

  gosec:
    name: gosec
    runs-on: ${{ inputs.runs_on }}
    continue-on-error: ${{ inputs.continue_on_error }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    # -----
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 'Setup Go'
        uses: ./.github/actions/setup-go
      - name: 'Install pinned security tools'
        uses: ./.github/actions/setup-tools
        with:
          install-args: --locked gosec
      - name: 'Run Gosec security scanner'
        shell: bash
        run: task lint:gosec

  govulncheck:
    name: govulncheck
    runs-on: ${{ inputs.runs_on }}
    continue-on-error: ${{ inputs.continue_on_error }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    # -----
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 'Setup Go'
        uses: ./.github/actions/setup-go
      - name: 'Install pinned govulncheck'
        uses: ./.github/actions/setup-tools
        with:
          install-args: --locked govulncheck
      # Match the CLI entry point and all GoReleaser build platforms.
      - name: 'Run Go vulnerability check (linux/amd64)'
        shell: bash
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 govulncheck .
      - name: 'Run Go vulnerability check (linux/arm64)'
        shell: bash
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 govulncheck .
      - name: 'Run Go vulnerability check (darwin/amd64)'
        shell: bash
        run: CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 govulncheck .
      - name: 'Run Go vulnerability check (darwin/arm64)'
        shell: bash
        run: CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 govulncheck .

  # CI analysis stays read-only; master results are published by 206-codeql-publish.yaml.
  codeql:
    name: codeql
    runs-on: ${{ inputs.runs_on }}
    continue-on-error: ${{ inputs.continue_on_error }}
    timeout-minutes: ${{ inputs.codeql_timeout_minutes }}
    permissions:
      actions: read
      contents: read
      security-events: read
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 'Setup Go'
        uses: ./.github/actions/setup-go
      - name: 'Set up project tooling'
        uses: ./.github/actions/setup-tools
        with:
          # CodeQL uses Go without installing mise-managed tools.
          cache: false
      - name: 'Initialize CodeQL'
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: go
      - name: 'Build'
        uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
      - name: 'Perform CodeQL analysis'
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: '.github/workflows/100-unified-workflow.yaml:codeql'
          upload: never
          upload-database: false
