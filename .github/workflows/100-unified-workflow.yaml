---

name: unified-workflow

on:
  # manual trigger
  workflow_dispatch:
  # push or merge to master
  push:
    branches:
      - master
  # pull request targeting master branch created or updated
  pull_request:
    branches:
      - master

permissions: {}

concurrency:
  group: >-
    ${{ github.event_name == 'pull_request' && format('unified-pr-{0}', github.event.pull_request.number) || format('unified-run-{0}-{1}',
    github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  gate-start:
    name: gate-start
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start full CI
        run: echo "Full CI started."

  # stage 1: linting

  lint:
    uses: ./.github/workflows/110-lint.yaml
    permissions:
      contents: read
    needs:
      - gate-start
    with:
      runs_on: ubuntu-latest
      continue_on_error: false
      timeout_minutes: 10

  # stage 2: unit, integration, and end-to-end tests

  unit-tests:
    uses: ./.github/workflows/120-unit-tests.yaml
    permissions:
      contents: read
    needs:
      - lint
    with:
      runs_on: ubuntu-latest
      continue_on_error: false
      timeout_minutes: 10

  integration-tests:
    uses: ./.github/workflows/120-integration-tests.yaml
    permissions:
      contents: read
    needs:
      - lint
    with:
      runs_on: ubuntu-latest
      continue_on_error: false
      timeout_minutes: 10

  e2e-tests:
    uses: ./.github/workflows/120-e2e-tests.yaml
    permissions:
      contents: read
    needs:
      - lint
    with:
      runs_on: ubuntu-latest
      continue_on_error: false
      timeout_minutes: 10

  # stage 3: pre-build security scans

  security:
    uses: ./.github/workflows/130-security.yaml
    permissions:
      actions: read
      contents: read
      security-events: read
    needs:
      - unit-tests
    with:
      runs_on: ubuntu-latest
      continue_on_error: false
      timeout_minutes: 15

  # stage 4: build artifacts

  build-artifacts:
    uses: ./.github/workflows/140-build-artifacts.yaml
    permissions:
      contents: read
    needs:
      - unit-tests
    with:
      runs_on: ubuntu-latest
      continue_on_error: false
      timeout_minutes: 30

  docker-prepare-tag:
    name: docker-prepare-tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - unit-tests
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: 'Prepare temporary CI image tag'
        id: tag
        run: echo "tag=ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

  docker-build:
    uses: ./.github/workflows/140-docker-build.yaml
    permissions:
      contents: read
      actions: read
      packages: write
      attestations: write
      id-token: write
    needs:
      - docker-prepare-tag
    with:
      runs_on: ubuntu-latest
      continue_on_error: false
      service_name: go42x
      image_tag: ${{ needs.docker-prepare-tag.outputs.tag }}
      platforms: linux/amd64,linux/arm64
      attestation: ${{ github.ref == 'refs/heads/master' }}
      generate_sbom: true
      attestation_sbom: false
      timeout_minutes: 30
      source_sha: ${{ github.sha }}

  security-extra:
    uses: ./.github/workflows/140-security-extra.yaml
    permissions:
      contents: read
      packages: read
    needs:
      - docker-build
    with:
      runs_on: ubuntu-latest
      continue_on_error: true
      image_reference: ${{ needs.docker-build.outputs.image_reference }}
      timeout_minutes: 30

  # stage 5: test artifacts

  test-artifacts:
    uses: ./.github/workflows/150-test-artifacts.yaml
    permissions:
      contents: read
    needs:
      - build-artifacts
    with:
      artifact_id: ${{ needs.build-artifacts.outputs.artifact_id }}
      continue_on_error: false
      timeout_minutes: 15

  # stage 6: coverage report

  coverage:
    uses: ./.github/workflows/160-coverage-report.yaml
    permissions:
      actions: read
      contents: read
      pull-requests: write
    needs:
      - unit-tests
      - integration-tests
      - e2e-tests
    with:
      runs_on: ubuntu-latest
      continue_on_error: true
      timeout_minutes: 10

  # stage 7: remove the temporary image after its consumers finish

  cleanup:
    if: ${{ always() && needs.docker-prepare-tag.result == 'success' && needs.docker-prepare-tag.outputs.tag != '' }}
    uses: ./.github/workflows/160-cleanup.yaml
    permissions:
      contents: read
      packages: write
    needs:
      - docker-prepare-tag
      - docker-build
      - security-extra
    with:
      runs_on: ubuntu-latest
      service_name: go42x
      image_tag: ${{ needs.docker-prepare-tag.outputs.tag }}
      timeout_minutes: 10

  # stage 8: required finish gate

  gate-finish:
    name: gate-finish
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - gate-start
      - lint
      - unit-tests
      - integration-tests
      - e2e-tests
      - security
      - build-artifacts
      - test-artifacts
      - docker-build
      - security-extra
      - cleanup
    steps:
      - name: 'Require all blocking jobs to succeed'
        env:
          GATE_START_RESULT: ${{ needs.gate-start.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          UNIT_TESTS_RESULT: ${{ needs.unit-tests.result }}
          INTEGRATION_TESTS_RESULT: ${{ needs.integration-tests.result }}
          E2E_TESTS_RESULT: ${{ needs.e2e-tests.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          BUILD_ARTIFACTS_RESULT: ${{ needs.build-artifacts.result }}
          TEST_ARTIFACTS_RESULT: ${{ needs.test-artifacts.result }}
          DOCKER_BUILD_RESULT: ${{ needs.docker-build.result }}
          SECURITY_EXTRA_RESULT: ${{ needs.security-extra.result }}
          CLEANUP_RESULT: ${{ needs.cleanup.result }}
        run: |-
          echo "gate-start: $GATE_START_RESULT"
          echo "lint: $LINT_RESULT"
          echo "unit-tests: $UNIT_TESTS_RESULT"
          echo "integration-tests: $INTEGRATION_TESTS_RESULT"
          echo "e2e-tests: $E2E_TESTS_RESULT"
          echo "security: $SECURITY_RESULT"
          echo "build-artifacts: $BUILD_ARTIFACTS_RESULT"
          echo "test-artifacts: $TEST_ARTIFACTS_RESULT"
          echo "docker-build: $DOCKER_BUILD_RESULT"
          echo "security-extra: $SECURITY_EXTRA_RESULT"
          echo "cleanup: $CLEANUP_RESULT"
          if [ "$GATE_START_RESULT" != 'success' ] || \
            [ "$LINT_RESULT" != 'success' ] || \
            [ "$UNIT_TESTS_RESULT" != 'success' ] || \
            [ "$INTEGRATION_TESTS_RESULT" != 'success' ] || \
            [ "$E2E_TESTS_RESULT" != 'success' ] || \
            [ "$SECURITY_RESULT" != 'success' ] || \
            [ "$BUILD_ARTIFACTS_RESULT" != 'success' ] || \
            [ "$TEST_ARTIFACTS_RESULT" != 'success' ] || \
            [ "$DOCKER_BUILD_RESULT" != 'success' ]; then
            echo '::error::One or more blocking CI jobs did not succeed.'
            exit 1
          fi
