---

name: unified-workflow

on:
  # manual trigger
  workflow_dispatch:
  # push or merge to master
  push:
    branches:
      - master
  # pull request targeting master branch created or updated
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:

  golangci-lint:
    uses: ./.github/workflows/110-golangci-lint.yaml
    with:
      runs_on: ubuntu-latest
      continue_on_error: false

  unit-tests:
    uses: ./.github/workflows/120-unit-tests.yaml
    needs:
        - golangci-lint
    with:
      runs_on: ubuntu-latest
      continue_on_error: false

  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs:
        - unit-tests
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    env:
      CGO_ENABLED: '0'
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v4
      - name: 'Setup Go'
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - name: 'Build CLI'
        run: go build -mod=readonly -trimpath -buildvcs=false -o build/go42x .
