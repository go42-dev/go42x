---

name: build-artifacts

# Build distributable packages with the publishing configuration, without signing or publishing.

on:
  workflow_call:
    inputs:
      runs_on:
        required: true
        type: string
      continue_on_error:
        required: true
        type: boolean
      timeout_minutes:
        required: false
        type: number
        default: 30
    outputs:
      artifact_id:
        description: "Immutable artifact ID containing the snapshot artifacts"
        value: ${{ jobs.build-artifacts.outputs.artifact_id }}

permissions: {}

jobs:
  build-artifacts:
    name: build-artifacts
    runs-on: ${{ inputs.runs_on }}
    continue-on-error: ${{ inputs.continue_on_error }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    env:
      MISE_DEFAULT_CONFIG_FILENAME: etc/mise.toml
      MISE_DATA_DIR: ${{ github.workspace }}/.tools
      MISE_CACHE_DIR: ${{ github.workspace }}/.tools/cache
      MISE_STATE_DIR: ${{ github.workspace }}/.tools/state
    steps:
      - name: 'Checkout repository and tags'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 'Setup Go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
      - name: 'Install pinned packaging tools'
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: '2026.9.1'
          install_args: --locked task goreleaser syft
      - name: 'Validate GoReleaser configuration'
        run: task release:check
      - name: 'Build snapshot artifacts'
        run: task release:snapshot
      - name: 'Upload snapshot artifacts'
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-artifacts-${{ github.run_attempt }}
          path: |-
            .build/dist/*.tar.gz
            .build/dist/*.deb
            .build/dist/*.rpm
            .build/dist/*.apk
            .build/dist/*.json
            .build/dist/checksums.txt
            .build/dist/homebrew/Casks/go42x.rb
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
