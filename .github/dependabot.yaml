---
version: 2

multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: "weekly"
    pull-request-branch-name:
      separator: "-"
    open-pull-requests-limit: 10

updates:
  - package-ecosystem: "gomod"
    directory: "/"
    cooldown:
      default-days: 7
    patterns:
      - "*"
    multi-ecosystem-group: "all-dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    cooldown:
      default-days: 7
    patterns:
      - "*"
    multi-ecosystem-group: "all-dependencies"
    # gh-aw compiles gh-aw-actions pins into workflow locks from the gh-aw
    # version in etc/mise.toml. Bump gh-aw and run `task generate:agentic`
    # instead; direct updates fail agentic-lint.
    ignore:
      - dependency-name: "github/gh-aw-actions/*"

