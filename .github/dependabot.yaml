---
version: 2

multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: "weekly"
    pull-request-branch-name:
      separator: "-"
    open-pull-requests-limit: 10

updates:
  - package-ecosystem: "gomod"
    directory: "/"
    cooldown:
      default-days: 7
    patterns:
      - "*"
    multi-ecosystem-group: "all-dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    cooldown:
      default-days: 7
    patterns:
      - "*"
    multi-ecosystem-group: "all-dependencies"

