---

name: ai-prepare-env
description: 'Prepares the environment for ai agents'

inputs:
  setup-task:
    description: 'Task used to install project tools'
    required: false
    default: 'setup'
  providers:
    description: 'Exact provider list; empty generates shared instructions only'
    required: false
    default: ''
  pull-mcp-image:
    description: 'Pull the MCP tools image for the latest stable go42x release'
    required: false
    default: 'false'
  mcp-image-repository:
    description: 'MCP tools image repository in ghcr.io'
    required: false
    default: 'ghcr.io/go42-dev/go42x'

runs:
  using: composite
  steps:
    - name: 'Prepare project environment'
      uses: ./.github/actions/prepare-env
      with:
        setup-task: ${{ inputs.setup-task }}
    # -----
    - name: 'Generate ai agent environment'
      env:
        CI: true
        CI_MODE: auto
        GITHUB_ACTIONS: true
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        GITHUB_EVENT_PAYLOAD: ${{ toJSON(github.event) }}
        GITHUB_HEAD_REF: ${{ github.head_ref }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
        GITHUB_SHA: ${{ github.sha }}
        GITHUB_SERVER_URL: ${{ github.server_url }}
        GITHUB_RUN_ID: ${{ github.run_id }}
        INPUT_PROVIDERS: ${{ inputs.providers }}
      run: task x -- agentenv generate --providers="$INPUT_PROVIDERS"
      shell: bash
    # -----
    - name: 'Refresh knowledge base after generation'
      run: task x -- kwb build
      shell: bash
    # -----
    - name: 'Authenticate to GitHub Container Registry'
      if: inputs.pull-mcp-image == 'true'
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
    # -----
    - name: 'Pull MCP tools image'
      if: inputs.pull-mcp-image == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        IMAGE_REPOSITORY: ${{ inputs.mcp-image-repository }}
      run: |-
        set -euo pipefail
        image_tag=$(gh api repos/go42-dev/go42x/releases/latest --jq .tag_name)
        image_reference="$IMAGE_REPOSITORY:$image_tag"
        docker pull "$image_reference"
        echo "GO42X_MCP_IMAGE_VERSION=$image_tag" >> "$GITHUB_ENV"
