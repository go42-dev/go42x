min_version = "2026.10.21"

[settings]
lockfile = true
exec_auto_install = false
disable_update_warning = true

[env]
GOTOOLCHAIN = "local"

[tools]
node = "26.7.0"
markdownlint-cli2 = "0.23.2"
actionlint = "1.7.12"
editorconfig-checker = "3.11.3"
hadolint = "2.15.1"
gitleaks = "8.30.1"
golangci-lint = "2.14.0"
golines = "0.13.0"
tombi = "1.5.4"
vale = "3.18.0"
zizmor = "1.31.1"
goreleaser = "2.18.1"
syft = "1.51.1"
cosign = "3.1.3"
"go:github.com/caarlos0/jsonfmt" = "0.5.2"
"go:github.com/daixiang0/gci" = "0.14.0"
"go:github.com/go-delve/delve/cmd/dlv" = "1.27.1"
"go:github.com/go42-dev/go42x" = "0.51.0"
"go:github.com/google/yamlfmt/cmd/yamlfmt" = "0.21.0"
"go:github.com/securego/gosec/v2/cmd/gosec" = "2.29.1-0.20260914113419-9e8e5d91f2f3"
"go:go.uber.org/mock/mockgen" = "0.6.0"
"go:go.uber.org/nilaway/cmd/nilaway" = "v0.0.0-20260808063849-8649a03c818a"
"go:golang.org/x/tools/gopls" = "0.24.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.7.0"

[tools."github:github/gh-aw"]
version = "0.93.5"
bin = "gh-aw"

[tools."github:github/gh-aw".platforms]
linux-x64 = { asset_pattern = "linux-amd64" }
linux-arm64 = { asset_pattern = "linux-arm64" }
macos-x64 = { asset_pattern = "darwin-amd64" }
macos-arm64 = { asset_pattern = "darwin-arm64" }
