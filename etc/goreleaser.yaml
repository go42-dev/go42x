---

version: 2

project_name: go42x

dist: .build/dist

before:
  hooks:
    - go mod download

builds:
  - id: go42x
    main: .
    binary: go42x
    env:
      - CGO_ENABLED=0
      - SOURCE_DATE_EPOCH=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags:
      - -v
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -s -w
      - -X github.com/go42-dev/go42x/internal/version.xBuildVersion={{ .Version }}

archives:
  - id: go42x
    name_template: >-
      {{ .ProjectName }}_ {{- .Version }}_ {{- if eq .Os "darwin" }}macOS{{ else }}{{ .Os }}{{ end }}_ {{- if eq .Arch "amd64"
      }}x86_64 {{- else if eq .Arch "386" }}i386 {{- else }}{{ .Arch }}{{ end }}
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md

homebrew_casks:
  - name: go42x
    ids:
      - go42x
    binaries:
      - go42x
    homepage: https://github.com/go42-dev/go42x
    description: Helper tool for go42 project
    skip_upload: auto
    repository:
      owner: go42-dev
      name: homebrew-go42x
      token: '{{ .Env.HOMEBREW_GITHUB_TOKEN }}'
    commit_author:
      use_github_app_token: true
    hooks:
      post:
        # Release checksums are signed with Sigstore; macOS binaries are not Apple-notarized.
        # Limit quarantine removal to the installed executable.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/go42x"]
          end

nfpms:
  - id: go42x-packages
    package_name: go42x
    vendor: go42-dev
    homepage: https://github.com/go42-dev/go42x
    maintainer: hasansino <hasansino@users.noreply.github.com>
    description: Helper tool for go42 project
    license: MIT
    formats:
      - deb
      - rpm
      - apk
    dependencies:
      - git
    recommends:
      - golang
    section: utils
    priority: optional
    file_name_template: >-
      {{ .PackageName }}_ {{- .Version }}_ {{- if eq .Os "darwin" }}macOS{{ else }}{{ .Os }}{{ end }}_ {{- if eq .Arch "amd64"
      }}x86_64 {{- else if eq .Arch "386" }}i386 {{- else if eq .Arch "arm64" }}aarch64 {{- else }}{{ .Arch }}{{ end }}
    contents:
      - src: LICENSE
        dst: /usr/share/licenses/go42x/LICENSE
      - src: README.md
        dst: /usr/share/doc/go42x/README.md
    deb:
      lintian_overrides:
        - statically-linked-binary
        - changelog-file-missing-in-native-package
    rpm:
      group: Applications/System
      compression: xz
    apk:
      signature:
        key_file: ""

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

snapshot:
  version_template: "{{ .Version }}-next"

changelog:
  sort: asc
  # The release tag stays local until publication; generate notes from Git history.
  use: git
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'
      - Merge pull request
      - Merge branch
  groups:
    - title: 'Changes'
      order: 999

release:
  github:
    owner: go42-dev
    name: go42x
  target_commitish: "{{ .Commit }}"
  prerelease: auto
  make_latest: '{{ if .Prerelease }}false{{ else }}true{{ end }}'
  name_template: "{{.ProjectName}} v{{.Version}}"

# generate SBOMs for archives
sboms:
  - artifacts: archive

# sign checksums.txt
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true
