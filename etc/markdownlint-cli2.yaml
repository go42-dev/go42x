---

config:
  default: true
  MD034: false

  MD060:
    style: aligned

  # Keep a visible H1 alongside front matter for readers in a checkout.
  MD025:
    front_matter_title: ""

  MD013:
    line_length: 120
    heading_line_length: 120
    code_block_line_length: 120
    tables: false

# Chunks are fragments inserted under the generated Instructions section.
overrides:
  - filter:
      - 'assets/agentenv/chunks/**/*.tpl.md'
      - '.go42x/chunks/**/*.tpl.md'
    config:
      MD041:
        level: 3
    combine: merge
  - filter:
      - '.github/workflows/*.md'
    config:
      MD041: false
    combine: merge

globs:
  - docs/**/*.md

gitignore: true

# Preserve upstream bytes even when a save-time formatter passes explicit files.
ignores:
  - '**/.go42x/upstream/**/*.md'
